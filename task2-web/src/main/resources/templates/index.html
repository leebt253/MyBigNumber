<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add2Num</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="container py-5">
    <header class="mb-5">
        <p class="eyebrow mb-2">ADD2NUM / TASK 2</p>
        <h1 class="display-5 fw-bold">Add numbers without limits.</h1>
        <p class="lead text-secondary">Every column is calculated from right to left and reported as it completes.</p>
    </header>

    <section class="row g-4 align-items-start">
        <div class="col-lg-5">
            <form id="addition-form" class="panel">
                <div class="mb-4">
                    <label for="first" class="form-label">First number</label>
                    <input id="first" class="form-control form-control-lg" inputmode="numeric" pattern="[0-9]+" required>
                </div>
                <div class="mb-4">
                    <label for="second" class="form-label">Second number</label>
                    <input id="second" class="form-control form-control-lg" inputmode="numeric" pattern="[0-9]+" required>
                </div>
                <button id="calculate" class="btn btn-dark btn-lg w-100" type="submit">Calculate sum <span aria-hidden="true">&rarr;</span></button>
                <div id="error" class="alert alert-danger mt-3 mb-0 d-none"></div>
            </form>
        </div>

        <div class="col-lg-7">
            <section id="progress-panel" class="panel d-none" aria-live="polite">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <div><span class="label">Progress</span><h2 id="progress-label" class="h4 mb-0">Waiting to start</h2></div>
                    <strong id="progress-percent">0%</strong>
                </div>
                <div class="progress mb-4"><div id="progress-bar" class="progress-bar" style="width: 0%"></div></div>
                <div id="result-block" class="result mb-4 d-none"><span class="label">Result</span><output id="result" class="result-value"></output></div>
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead><tr><th>Step</th><th>Digits</th><th>Carry in</th><th>Total</th><th>Output</th></tr></thead>
                        <tbody id="steps"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </section>
</main>
<script>
const form = document.getElementById('addition-form');
const button = document.getElementById('calculate');
const error = document.getElementById('error');
const panel = document.getElementById('progress-panel');
const bar = document.getElementById('progress-bar');
const percent = document.getElementById('progress-percent');
const label = document.getElementById('progress-label');
const steps = document.getElementById('steps');
const resultBlock = document.getElementById('result-block');
const result = document.getElementById('result');
let stream;

form.addEventListener('submit', async event => {
    event.preventDefault();
    if (stream) stream.close();
    error.classList.add('d-none');
    panel.classList.remove('d-none');
    resultBlock.classList.add('d-none');
    steps.innerHTML = '';
    updateProgress(0, 'Starting calculation');
    button.disabled = true;
    try {
        const response = await fetch('/api/calculations', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({first: document.getElementById('first').value, second: document.getElementById('second').value})
        });
        if (!response.ok) throw new Error('Please enter non-negative decimal integers only.');
        const job = await response.json();
        stream = new EventSource('/api/calculations/' + job.id + '/progress');
        stream.addEventListener('step', event => {
            const data = JSON.parse(event.data);
            updateProgress(data.percent, 'Processing column ' + data.completed + ' of ' + data.total);
            appendStep(data.step);
        });
        stream.addEventListener('complete', event => {
            const data = JSON.parse(event.data);
            updateProgress(100, 'Calculation complete');
            result.textContent = data.result;
            resultBlock.classList.remove('d-none');
            button.disabled = false;
            stream.close();
        });
        stream.onerror = () => {
            if (percent.textContent !== '100%') showError('The progress stream was interrupted.');
            button.disabled = false;
            stream.close();
        };
    } catch (exception) {
        showError(exception.message);
        button.disabled = false;
    }
});

function updateProgress(value, message) {
    bar.style.width = value + '%';
    percent.textContent = value + '%';
    label.textContent = message;
}

function appendStep(step) {
    const row = document.createElement('tr');
    row.innerHTML = '<td>' + step.position + '</td><td>' + step.digit1 + ' + ' + step.digit2 + '</td><td>' + step.carryIn + '</td><td>' + step.total + '</td><td><strong>' + step.resultDigit + '</strong><small class="text-secondary"> / carry ' + step.carryOut + '</small></td>';
    steps.prepend(row);
}

function showError(message) {
    error.textContent = message;
    error.classList.remove('d-none');
}
</script>
</body>
</html>
